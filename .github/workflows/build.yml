# Builds the ScratchCode desktop installers on GitHub's machines and attaches them to a Release.
# Push this "desktop" folder as the root of a repository, then push a tag like v1.0.0.
name: Desktop installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg --x64 --arm64
          - os: ubuntu-latest
            args: --linux AppImage deb tar.gz --x64
          - os: windows-latest
            args: --win nsis --x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.exe
